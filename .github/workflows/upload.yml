name: Upload videos

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Upload due videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          IG_TOKEN_1: ${{ secrets.IG_TOKEN_1 }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
        run: python scripts/upload.py
      - name: Commit queue changes and log
        if: always()
        run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git add -A videos logs
          git diff --cached --quiet || (git commit -m "Upload run" && git pull --rebase origin main && git push)
