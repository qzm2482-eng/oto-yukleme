name: Compact repo history

# Owner-approved (19 Nov 2026): weekly, replace git history with one snapshot of the
# current files so already-uploaded video files stop taking space.
on:
  schedule:
    - cron: "40 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -q -m "Snapshot $(date -u +%F)"
          git push -f origin snapshot:main
